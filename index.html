
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b18">
<title>ZEZE GALERI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#100b18;
  --panel:#21172d;
  --gold:#e6c477;
  --purple:#9b72c9;
  --text:#fff8ff;
  --muted:#b9aabd;
}
* {box-sizing:border-box}
body {
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#382249,#100b18 55%);
}
header {
  text-align:center;
  padding:36px 55px 25px;
  position:relative;
}
.logo {
  color:var(--gold);
  font-size:clamp(28px,8vw,46px);
  font-weight:900;
  letter-spacing:4px;
  text-shadow:0 0 20px #d5a94d55;
}
.subtitle {
  color:var(--muted);
  font-size:10px;
  letter-spacing:3px;
  margin-top:9px;
}
.menu-button {
  position:absolute;
  top:29px;
  right:15px;
  width:43px;
  height:43px;
  border-radius:13px;
  border:1px solid #b18a5766;
  background:#21172d;
  color:var(--gold);
  font-size:27px;
  cursor:pointer;
}
.menu-panel {
  display:none;
  position:absolute;
  z-index:30;
  top:78px;
  right:14px;
  width:min(310px,calc(100vw - 28px));
  padding:17px;
  text-align:left;
  border:1px solid #b18a5777;
  border-radius:16px;
  background:#21172d;
  box-shadow:0 15px 40px #000b;
}
.menu-panel.show {display:block}
.menu-panel h3 {
  color:var(--gold);
  margin:0 0 14px;
}
.menu-panel input {
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #654b77;
  background:#100b18;
  color:white;
  font-size:14px;
}
button,.download {
  border:0;
  border-radius:10px;
  padding:12px 15px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
  font-size:13px;
}
.primary {
  background:linear-gradient(135deg,#e9ce8a,#b88b42);
  color:#21152b;
}
.secondary {background:#51396a;color:white}
.danger {background:#873c52;color:white}
.menu-panel button {width:100%;margin-top:8px}
.menu-note {
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-bottom:10px;
}
#status {
  color:var(--gold);
  font-size:12px;
  margin-top:12px;
  overflow-wrap:anywhere;
}
main {
  max-width:1100px;
  margin:auto;
  padding:12px 14px 45px;
}
.gallery-title {
  color:var(--gold);
  text-align:center;
  font-size:22px;
  letter-spacing:3px;
  margin:23px 0;
}
.gallery {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.photo-card {
  min-width:0;
  overflow:hidden;
  border-radius:14px;
  border:1px solid #b18a5740;
  background:var(--panel);
  box-shadow:0 8px 20px #0005;
}
.photo-card img {
  display:block;
  width:100%;
  aspect-ratio:1/1.15;
  object-fit:cover;
  cursor:pointer;
  background:#241a2e;
}
.photo-card img:active {opacity:.8}
.filename {
  padding:9px;
  color:var(--muted);
  font-size:11px;
  overflow-wrap:anywhere;
}
.empty {
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}
#viewer {
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#08050eef;
  padding:65px 14px 25px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:17px;
}
#viewer.show {display:flex}
#viewerImage {
  max-width:100%;
  max-height:72vh;
  object-fit:contain;
  border-radius:10px;
}
.viewer-close {
  position:absolute;
  top:17px;
  right:17px;
  background:#fff;
  color:#111;
  font-size:21px;
  width:42px;
  height:42px;
}
.viewer-save {
  min-width:190px;
  background:linear-gradient(135deg,#e9ce8a,#b88b42);
  color:#21152b;
}
#downloadStatus {
  color:var(--gold);
  font-size:12px;
  text-align:center;
}
footer {
  text-align:center;
  color:#8f7c9a;
  font-size:12px;
  padding:25px;
}
[hidden] {display:none!important}

@media(max-width:650px) {
  .gallery {grid-template-columns:repeat(2,minmax(0,1fr))}
  main {padding-left:10px;padding-right:10px}
  header {padding-top:32px}
}
</style>
</head>

<body>

<header>
  <button class="menu-button" id="menuButton"
    onclick="toggleMenu()" aria-label="Menu">⋮</button>

  <div class="logo">ZEZE GALERI</div>
  <div class="subtitle">A BEAUTIFUL PLACE FOR MEMORIES</div>

  <div class="menu-panel" id="menuPanel">
    <h3>⚙ MENU PEMILIK</h3>

    <div id="loginArea">
      <div class="menu-note">
        Login untuk mengelola koleksi foto.
      </div>
      <input id="email" type="email"
        placeholder="Email pemilik" autocomplete="username">
      <input id="password" type="password"
        placeholder="Password" autocomplete="current-password">
      <button class="primary" id="loginBtn" onclick="login()">
        🔐 MASUK
      </button>
    </div>

    <div id="ownerArea" hidden>
      <div class="menu-note">✓ Login sebagai pemilik.</div>
      <input id="photoInput" type="file"
        accept="image/*" multiple>
      <button class="primary" id="uploadBtn" onclick="uploadPhotos()">
        ⬆ UPLOAD FOTO
      </button>
      <button class="secondary" onclick="logout()">
        KELUAR
      </button>
    </div>

    <div id="status"></div>
  </div>
</header>

<main>
  <h2 class="gallery-title">✦ KOLEKSI FOTO ✦</h2>
  <section id="gallery" class="gallery">
    <div class="empty">Memuat galeri...</div>
  </section>
</main>

<footer>
  ZEZE GALERI © 2026 · All Memories Are Precious
</footer>

<div id="viewer" onclick="closeViewer()">
  <button class="viewer-close"
    onclick="closeViewer()">✕</button>

  <img id="viewerImage" alt="Foto diperbesar"
    onclick="event.stopPropagation()">

  <button class="viewer-save" id="saveButton"
    onclick="event.stopPropagation(); saveCurrentPhoto()">
    ⬇ SIMPAN FOTO
  </button>

  <div id="downloadStatus"></div>
</div>

<script>
const SUPABASE_URL =
  "https://dhjxyldtygcibrtnpjcd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_daMV08AfTIex0whIdKdtsQ_wwsfghsp";

const BUCKET = "zeze-foto";

const OWNER_UID =
  "d0a87020-4e24-4982-843a-f1d56f657267";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentSession = null;
let galleryPromise = null;
let selectedPhoto = null;

const gallery = document.getElementById("gallery");
const statusBox = document.getElementById("status");

function setStatus(message) {
  statusBox.textContent = message;
}

function isOwner() {
  return currentSession?.user?.id === OWNER_UID;
}

function toggleMenu() {
  document.getElementById("menuPanel")
    .classList.toggle("show");
}

document.addEventListener("click", function(event) {
  const panel = document.getElementById("menuPanel");
  const button = document.getElementById("menuButton");

  if (!panel.contains(event.target) &&
      !button.contains(event.target)) {
    panel.classList.remove("show");
  }
});

function updateLoginUI() {
  const owner = isOwner();

  document.getElementById("loginArea").hidden = owner;
  document.getElementById("ownerArea").hidden = !owner;

  if (owner) {
    setStatus("Login berhasil. Selamat datang!");
  } else if (currentSession) {
    setStatus("Akun ini bukan akun pemilik.");
  } else {
    setStatus("");
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    setStatus("Masukkan email dan password.");
    return;
  }

  btn.disabled = true;
  setStatus("Sedang masuk...");

  try {
    const {data,error} = await db.auth.signInWithPassword({
      email,password
    });

    if (error) throw error;

    currentSession = data.session;

    if (!isOwner()) {
      await db.auth.signOut();
      currentSession = null;
      updateLoginUI();
      setStatus("Akun ini bukan akun pemilik.");
      return;
    }

    updateLoginUI();
    await loadGallery();

  } catch(error) {
    setStatus("Login gagal: " + error.message);
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  const {error} = await db.auth.signOut();

  if (error) {
    setStatus("Gagal keluar: " + error.message);
    return;
  }

  currentSession = null;
  updateLoginUI();
  await loadGallery();
}

async function uploadPhotos() {
  if (!isOwner()) {
    setStatus("Silakan login sebagai pemilik.");
    return;
  }

  const input = document.getElementById("photoInput");
  const files = Array.from(input.files || []);

  if (!files.length) {
    setStatus("Pilih foto terlebih dahulu.");
    return;
  }

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;

  let success = 0;

  try {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;

      const safeName = file.name.replace(
        /[^a-zA-Z0-9._-]/g,"_"
      );

      const uniqueName =
        Date.now() + "_" +
        Math.random().toString(36).slice(2,9) +
        "_" + safeName;

      const {error} = await db.storage.from(BUCKET).upload(
        uniqueName,file,{
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );

      if (error) throw error;
      success++;
    }

    input.value = "";
    setStatus(success + " foto berhasil diupload.");
    await loadGallery();

  } catch(error) {
    setStatus("Upload gagal: " + error.message);
  } finally {
    btn.disabled = false;
  }
}

function isImageFile(file) {
  const mime = file.metadata?.mimetype || "";

  return mime.startsWith("image/") ||
    /\.(jpg|jpeg|png|gif|webp|avif|bmp)$/i.test(file.name);
}

async function loadGallery() {
  if (galleryPromise) return galleryPromise;

  galleryPromise = (async () => {
    gallery.replaceChildren();

    const loading = document.createElement("div");
    loading.className = "empty";
    loading.textContent = "Memuat koleksi foto...";
    gallery.appendChild(loading);

    try {
      const {data,error} = await db.storage.from(BUCKET).list("",{
        limit:1000,
        sortBy:{column:"created_at",order:"desc"}
      });

      if (error) throw error;

      const seen = new Set();

      const photos = (data || []).filter(file => {
        if (!file.id || !isImageFile(file)) return false;
        if (seen.has(file.name)) return false;

        seen.add(file.name);
        return true;
      });

      gallery.replaceChildren();

      if (!photos.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Belum ada foto di galeri.";
        gallery.appendChild(empty);
        return;
      }

      for (const file of photos) {
        const path = file.name;

        const {data:publicData} = db.storage
          .from(BUCKET).getPublicUrl(path);

        const url = publicData.publicUrl;

        const card = document.createElement("article");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = url;
        img.alt = file.name;
        img.loading = "lazy";
        img.onclick = () => openViewer(path,url,file.name);

        const name = document.createElement("div");
        name.className = "filename";
        name.textContent = file.name;

        card.appendChild(img);
        card.appendChild(name);

        if (isOwner()) {
          const actions = document.createElement("div");
          actions.style.padding = "9px";

          const del = document.createElement("button");
          del.className = "danger";
          del.style.width = "100%";
          del.textContent = "🗑 HAPUS FOTO";
          del.onclick = () => deletePhoto(path);

          actions.appendChild(del);
          card.appendChild(actions);
        }

        gallery.appendChild(card);
      }

    } catch(error) {
      gallery.replaceChildren();

      const message = document.createElement("div");
      message.className = "empty";
      message.textContent = "Galeri gagal dimuat: " + error.message;
      gallery.appendChild(message);
    }
  })();

  try {
    await galleryPromise;
  } finally {
    galleryPromise = null;
  }
}

function openViewer(path,url,name) {
  selectedPhoto = {path,url,name};

  document.getElementById("viewerImage").src = url;
  document.getElementById("downloadStatus").textContent = "";
  document.getElementById("saveButton").disabled = false;
  document.getElementById("viewer").classList.add("show");
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("show");
  document.getElementById("viewerImage").src = "";
  selectedPhoto = null;
}

async function saveCurrentPhoto() {
  if (!selectedPhoto) return;

  const btn = document.getElementById("saveButton");
  const info = document.getElementById("downloadStatus");

  btn.disabled = true;
  btn.textContent = "MENYIAPKAN FOTO...";
  info.textContent = "";

  try {
    const {data,error} = await db.storage
      .from(BUCKET)
      .download(selectedPhoto.path);

    if (error) throw error;

    const objectUrl = URL.createObjectURL(data);
    const link = document.createElement("a");

    link.href = objectUrl;
    link.download = selectedPhoto.name;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objectUrl),30000);

    info.textContent = "Foto berhasil disiapkan untuk disimpan.";

  } catch(error) {
    info.textContent = "Gagal menyimpan: " + error.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "⬇ SIMPAN FOTO";
  }
}

async function deletePhoto(path) {
  if (!isOwner()) return;

  if (!confirm("Yakin ingin menghapus foto ini?")) return;

  setStatus("Menghapus foto...");

  const {error} = await db.storage.from(BUCKET).remove([path]);

  if (error) {
    setStatus("Gagal menghapus: " + error.message);
    return;
  }

  setStatus("Foto berhasil dihapus.");
  await loadGallery();
}

async function initialize() {
  const {data} = await db.auth.getSession();

  currentSession = data.session;
  updateLoginUI();
  await loadGallery();
}

db.auth.onAuthStateChange((_event,session) => {
  currentSession = session;
  updateLoginUI();

  setTimeout(() => loadGallery(),0);
});

initialize();
</script>

</body>
</html>
