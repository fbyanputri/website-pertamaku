
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100b18">
<title>ZEZE GALERI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #100b18;
  --panel: #1c1426;
  --gold: #e6c477;
  --purple: #9b72c9;
  --text: #f8f2ff;
  --muted: #b9aabd;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(circle at top, #352044, #100b18 55%);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 38px 16px 24px;
}

.logo {
  color: var(--gold);
  font-size: clamp(30px, 8vw, 48px);
  font-weight: 900;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #d5a94d55;
}

.subtitle {
  color: var(--muted);
  letter-spacing: 3px;
  font-size: 11px;
  margin-top: 10px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 12px 15px 45px;
}

.panel {
  background: #1c1426dd;
  border: 1px solid #b18a573d;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 22px;
  box-shadow: 0 12px 35px #0005;
}

h2 {
  color: var(--gold);
  font-size: 19px;
  margin: 0 0 15px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border-radius: 10px;
  border: 1px solid #654b77;
  background: #100b18;
  color: white;
  font-size: 15px;
}

button, .download {
  border: none;
  border-radius: 10px;
  padding: 12px 17px;
  font-weight: bold;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
  font-size: 13px;
}

.primary {
  background: linear-gradient(135deg, #e9ce8a, #b88b42);
  color: #21152b;
}

.secondary {
  background: #51396a;
  color: white;
}

.danger {
  background: #873c52;
  color: white;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 12px;
}

#status {
  color: var(--gold);
  font-size: 13px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.gallery-title {
  text-align: center;
  margin: 35px 0 20px;
  color: var(--gold);
  font-size: 23px;
  letter-spacing: 3px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}

.photo-card {
  background: var(--panel);
  border: 1px solid #b18a5740;
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
  box-shadow: 0 8px 20px #0005;
}

.photo-card img {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.15;
  object-fit: cover;
  cursor: pointer;
  background: #241a2e;
}

.photo-actions {
  display: flex;
  flex-direction: column;
  gap: 7px;
  padding: 9px;
}

.photo-actions button,
.photo-actions a {
  width: 100%;
}

.filename {
  color: var(--muted);
  font-size: 11px;
  padding: 0 9px;
  overflow-wrap: anywhere;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 35px 10px;
  grid-column: 1 / -1;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #000e;
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

#viewer img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 10px;
}

#viewer button {
  position: absolute;
  top: 18px;
  right: 18px;
  background: white;
  color: black;
  font-size: 20px;
}

footer {
  text-align: center;
  color: #8f7c9a;
  font-size: 12px;
  padding: 25px;
}

@media(max-width: 650px) {
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main { padding-left: 11px; padding-right: 11px; }
  .panel { padding: 14px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">ZEZE GALERI</div>
  <div class="subtitle">A BEAUTIFUL PLACE FOR MEMORIES</div>
</header>

<main>

  <section class="panel">
    <h2>🔐 Login Pemilik</h2>

    <div id="loginArea">
      <input id="email" type="email"
        placeholder="Email pemilik" autocomplete="username">

      <input id="password" type="password"
        placeholder="Password" autocomplete="current-password">

      <div class="actions">
        <button class="primary" id="loginBtn" onclick="login()">
          MASUK
        </button>
      </div>
    </div>

    <div id="ownerArea" hidden>
      <p style="color:#e6c477">✓ Kamu sudah login sebagai pemilik.</p>

      <input id="photoInput" type="file"
        accept="image/*" multiple>

      <div class="actions">
        <button class="primary" id="uploadBtn" onclick="uploadPhotos()">
          ⬆ UPLOAD FOTO
        </button>

        <button class="secondary" onclick="logout()">
          KELUAR
        </button>
      </div>
    </div>

    <div id="status"></div>
  </section>

  <h2 class="gallery-title">✦ KOLEKSI FOTO ✦</h2>

  <section id="gallery" class="gallery">
    <div class="empty">Memuat galeri...</div>
  </section>

</main>

<footer>
  ZEZE GALERI © 2026 · All Memories Are Precious
</footer>

<div id="viewer" onclick="closeViewer()">
  <button onclick="closeViewer()">✕</button>
  <img id="viewerImage" alt="Foto diperbesar">
</div>

<script>
const SUPABASE_URL =
  "https://dhjxyldtygcibrtnpjcd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_daMV08AfTIex0whIdKdtsQ_wwsfghsp";

const BUCKET = "zeze-foto";

const OWNER_UID =
  "d0a87020-4e24-4982-843a-f1d56f657267";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const gallery = document.getElementById("gallery");
const statusBox = document.getElementById("status");

let currentSession = null;
let galleryPromise = null;

function setStatus(message) {
  statusBox.textContent = message;
}

function isOwner() {
  return currentSession?.user?.id === OWNER_UID;
}

function updateLoginUI() {
  const owner = isOwner();

  document.getElementById("loginArea").hidden = owner;
  document.getElementById("ownerArea").hidden = !owner;

  if (owner) {
    setStatus("Login berhasil. Selamat datang!");
  } else {
    setStatus("");
  }
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");

  if (!email || !password) {
    setStatus("Masukkan email dan password terlebih dahulu.");
    return;
  }

  btn.disabled = true;
  setStatus("Sedang masuk...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    currentSession = data.session;
    updateLoginUI();
  } catch (error) {
    setStatus("Login gagal: " + error.message);
  } finally {
    btn.disabled = false;
  }
}

async function logout() {
  const { error } = await db.auth.signOut();

  if (error) {
    setStatus("Gagal keluar: " + error.message);
    return;
  }

  currentSession = null;
  updateLoginUI();
  await loadGallery();
}

async function uploadPhotos() {
  if (!isOwner()) {
    setStatus("Silakan login sebagai pemilik.");
    return;
  }

  const input = document.getElementById("photoInput");
  const files = Array.from(input.files || []);

  if (!files.length) {
    setStatus("Pilih foto terlebih dahulu.");
    return;
  }

  const btn = document.getElementById("uploadBtn");
  btn.disabled = true;

  let success = 0;

  try {
    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      const uniqueName =
        Date.now() + "_" +
        Math.random().toString(36).slice(2, 9) +
        "_" + safeName;

      const { error } = await db.storage
        .from(BUCKET)
        .upload(uniqueName, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (error) throw error;

      success++;
    }

    input.value = "";
    setStatus(success + " foto berhasil diupload.");

    await loadGallery();
  } catch (error) {
    setStatus("Upload gagal: " + error.message);
  } finally {
    btn.disabled = false;
  }
}

async function deletePhoto(path) {
  if (!isOwner()) return;

  const confirmed = confirm("Yakin ingin menghapus foto ini?");
  if (!confirmed) return;

  setStatus("Menghapus foto...");

  const { error } = await db.storage
    .from(BUCKET)
    .remove([path]);

  if (error) {
    setStatus("Gagal menghapus: " + error.message);
    return;
  }

  setStatus("Foto berhasil dihapus.");
  await loadGallery();
}

function openViewer(url) {
  document.getElementById("viewerImage").src = url;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("viewerImage").src = "";
}

function isImageFile(file) {
  const mime = file.metadata?.mimetype || "";
  return mime.startsWith("image/") ||
    /\.(jpg|jpeg|png|gif|webp|avif|bmp)$/i.test(file.name);
}

async function loadGallery() {
  // Mencegah pemuatan galeri yang berjalan bersamaan.
  if (galleryPromise) return galleryPromise;

  galleryPromise = (async () => {
    gallery.replaceChildren();

    const loading = document.createElement("div");
    loading.className = "empty";
    loading.textContent = "Memuat koleksi foto...";
    gallery.appendChild(loading);

    try {
      const { data, error } = await db.storage
        .from(BUCKET)
        .list("", {
          limit: 1000,
          sortBy: { column: "created_at", order: "desc" }
        });

      if (error) throw error;

      // Hanya ambil file gambar, bukan folder.
      // Set mencegah file yang sama ditampilkan dua kali.
      const seen = new Set();

      const photos = (data || []).filter(file => {
        if (!file.id || !isImageFile(file)) return false;

        const path = file.name;

        if (seen.has(path)) return false;

        seen.add(path);
        return true;
      });

      gallery.replaceChildren();

      if (!photos.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Belum ada foto di galeri.";
        gallery.appendChild(empty);
        return;
      }

      for (const file of photos) {
        const path = file.name;

        const { data: publicData } = db.storage
          .from(BUCKET)
          .getPublicUrl(path);

        const url = publicData.publicUrl;

        const card = document.createElement("article");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = url;
        img.alt = file.name;
        img.loading = "lazy";
        img.onclick = () => openViewer(url);

        const name = document.createElement("div");
        name.className = "filename";
        name.textContent = file.name;

        const actions = document.createElement("div");
        actions.className = "photo-actions";

        const download = document.createElement("a");
        download.className = "download primary";
        download.textContent = "⬇ SIMPAN FOTO";

        // Parameter download meminta Storage mengirim file
        // sebagai unduhan, bukan sekadar menampilkan gambar.
        download.href = db.storage
          .from(BUCKET)
          .getPublicUrl(path, { download: true })
          .data.publicUrl;

        download.setAttribute("download", file.name);

        actions.appendChild(download);

        if (isOwner()) {
          const del = document.createElement("button");
          del.className = "danger";
          del.textContent = "🗑 HAPUS FOTO";
          del.onclick = () => deletePhoto(path);
          actions.appendChild(del);
        }

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(actions);

        gallery.appendChild(card);
      }

    } catch (error) {
      gallery.replaceChildren();

      const message = document.createElement("div");
      message.className = "empty";
      message.textContent = "Galeri gagal dimuat: " + error.message;
      gallery.appendChild(message);
    }
  })();

  try {
    await galleryPromise;
  } finally {
    galleryPromise = null;
  }
}

// Periksa sesi login saat website dibuka.
async function initialize() {
  const { data } = await db.auth.getSession();

  currentSession = data.session;
  updateLoginUI();

  await loadGallery();
}

// Perbarui tampilan ketika status login berubah.
db.auth.onAuthStateChange((_event, session) => {
  currentSession = session;
  updateLoginUI();

  // Tunggu callback auth selesai sebelum memuat ulang galeri.
  setTimeout(() => loadGallery(), 0);
});

initialize();
</script>

</body>
</html>
