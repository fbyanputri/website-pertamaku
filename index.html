
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEZE GALERI | Black Gold Royal</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #d6b46a;
  --gold-light: #f5dfa1;
  --gold-dark: #927039;
  --black: #080808;
  --panel: #11100e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #eee5d1;
  font-family: 'Poppins', sans-serif;
  background:
    radial-gradient(ellipse at 50% 0%, #302416 0%, transparent 40%),
    radial-gradient(ellipse at 10% 50%, #17120d 0%, transparent 40%),
    #080808;
}

button, input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

header {
  position: relative;
  text-align: center;
  padding: 38px 55px 28px;
  border-bottom: 1px solid rgba(214,180,106,.25);
  background: linear-gradient(180deg, rgba(0,0,0,.7), rgba(15,12,8,.35));
}

.header-ornament {
  color: var(--gold);
  font-size: 18px;
  letter-spacing: 9px;
  margin-bottom: 10px;
}

.logo-mark {
  width: 43px;
  height: 43px;
  border: 1px solid var(--gold);
  color: var(--gold-light);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-family: 'Cinzel', serif;
  font-size: 25px;
  transform: rotate(45deg);
  box-shadow: 0 0 18px rgba(214,180,106,.15);
}

.logo-mark span {
  transform: rotate(-45deg);
}

.logo {
  margin: 0;
  font-family: 'Cinzel', serif;
  font-size: clamp(27px, 7vw, 43px);
  font-weight: 600;
  letter-spacing: 5px;
  color: var(--gold-light);
  text-shadow: 0 2px 16px rgba(214,180,106,.25);
}

.tagline {
  color: #bca678;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 2px;
  margin-top: 8px;
}

.header-line {
  width: 125px;
  height: 1px;
  margin: 17px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.menu-button {
  position: absolute;
  top: 23px;
  right: 19px;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(214,180,106,.45);
  border-radius: 50%;
  background: rgba(20,17,12,.85);
  color: var(--gold-light);
  font-size: 23px;
  line-height: 1;
}

.menu-button:active {
  background: #3a2b17;
}

.menu-panel {
  display: none;
  position: absolute;
  z-index: 20;
  top: 72px;
  right: 18px;
  width: min(300px, calc(100vw - 36px));
  padding: 20px;
  text-align: left;
  border: 1px solid var(--gold-dark);
  border-radius: 12px;
  background: rgba(17,15,12,.98);
  box-shadow: 0 15px 40px #000;
}

.menu-panel.show {
  display: block;
}

.menu-title {
  color: var(--gold-light);
  font-family: 'Cinzel', serif;
  font-size: 15px;
  text-align: center;
  margin-bottom: 15px;
}

.menu-panel input {
  display: block;
  width: 100%;
  margin: 9px 0;
  padding: 12px;
  color: white;
  background: #090909;
  border: 1px solid #594625;
  border-radius: 7px;
  outline: none;
}

.gold-button {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--gold);
  border-radius: 7px;
  color: #160f06;
  background: linear-gradient(135deg, #f1d99a, #b58b42);
  font-weight: 600;
}

.dark-button {
  width: 100%;
  padding: 10px;
  border: 1px solid #806536;
  border-radius: 7px;
  color: var(--gold-light);
  background: #17130d;
}

.owner-area {
  display: none;
}

.owner-area.show {
  display: block;
}

.owner-label {
  color: var(--gold);
  font-size: 12px;
  text-align: center;
  margin-bottom: 12px;
}

.upload-label {
  display: block;
  text-align: center;
  padding: 12px;
  border: 1px dashed var(--gold);
  border-radius: 8px;
  color: var(--gold-light);
  cursor: pointer;
  margin-bottom: 10px;
}

.upload-label input {
  display: none;
}

.status {
  color: #c7b58c;
  font-size: 12px;
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
  overflow-wrap: anywhere;
}

main {
  max-width: 1250px;
  padding: 28px 17px 60px;
  margin: auto;
}

.gallery-heading {
  text-align: center;
  margin-bottom: 27px;
}

.gallery-heading h2 {
  margin: 0;
  color: var(--gold-light);
  font-family: 'Cinzel', serif;
  font-size: 20px;
  letter-spacing: 3px;
  font-weight: 500;
}

.gallery-heading p {
  color: #9d8b6b;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  margin: 8px 0 0;
}

.gallery-heading .heading-line {
  width: 75px;
  height: 1px;
  margin: 14px auto 0;
  background: var(--gold-dark);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px 15px;
  align-items: start;
}

.photo-card {
  position: relative;
  min-width: 0;
  padding: 9px;
  background: linear-gradient(145deg, #292014, #090909 55%, #302416);
  box-shadow: 0 8px 22px rgba(0,0,0,.55);
  cursor: pointer;
  transition: transform .25s, box-shadow .25s;
}

.photo-card:active {
  transform: scale(.98);
}

/* Variasi bingkai untuk setiap foto */
.frame-0 {
  border: 2px solid #c7a45c;
  outline: 1px solid #5b4524;
  outline-offset: -6px;
  border-radius: 2px;
}

.frame-1 {
  border: 1px solid #e0c47f;
  border-radius: 12px;
  padding: 11px;
  box-shadow: inset 0 0 0 2px #3a2b17, 0 8px 22px #000;
}

.frame-2 {
  border: 3px double #c8a45b;
  border-radius: 2px;
  padding: 7px;
}

.frame-3 {
  border: 1px solid #a98645;
  border-radius: 3px;
  padding: 12px;
  background:
    linear-gradient(135deg, #49371d, #0b0a08 35%, #21180d);
}

.frame-4 {
  border: 2px solid #b28c4a;
  border-radius: 2px;
  padding: 8px;
  outline: 1px dashed rgba(239,211,147,.65);
  outline-offset: -5px;
}

.frame-0::before,
.frame-0::after,
.frame-2::before,
.frame-2::after {
  content: "✦";
  position: absolute;
  color: #f0d28d;
  z-index: 2;
  font-size: 13px;
  text-shadow: 0 0 8px #c49b4e;
}

.frame-0::before,
.frame-2::before {
  top: 2px;
  left: 4px;
}

.frame-0::after,
.frame-2::after {
  bottom: 2px;
  right: 4px;
}

.frame-1::before {
  content: "❖";
  position: absolute;
  z-index: 2;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold-light);
  background: #15110b;
  padding: 0 7px;
}

.frame-3::before {
  content: "✧  ✧";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  color: #e7c77e;
  font-size: 11px;
  z-index: 2;
  letter-spacing: 7px;
}

.frame-4::after {
  content: "❦";
  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--gold-light);
  background: #17120b;
  padding: 0 7px;
  z-index: 2;
}

.photo-card img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 430px;
  object-fit: contain;
  background: #080808;
}

.photo-name {
  padding: 10px 3px 3px;
  color: #d9c28e;
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.delete-button {
  display: block;
  width: 100%;
  margin-top: 8px;
  padding: 7px;
  color: #f2c8bd;
  background: #26100d;
  border: 1px solid #6e352b;
  border-radius: 5px;
  font-size: 11px;
}

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 55px 15px;
  border: 1px dashed #755a30;
  color: #bda779;
  font-family: 'Playfair Display', serif;
}

.empty-state .empty-symbol {
  font-size: 35px;
  color: var(--gold);
  margin-bottom: 12px;
}

footer {
  padding: 22px 10px 30px;
  text-align: center;
  color: #786748;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 1px;
}

/* Tampilan foto besar */
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.97);
  padding: 55px 15px 25px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.viewer.show {
  display: flex;
}

.viewer-close {
  position: absolute;
  top: 12px;
  right: 17px;
  color: var(--gold-light);
  background: transparent;
  border: 0;
  font-size: 34px;
}

.viewer-frame {
  max-width: 95vw;
  max-height: 75vh;
  padding: 10px;
  border: 2px solid var(--gold);
  outline: 1px solid #74572a;
  outline-offset: -6px;
  box-shadow: 0 0 35px rgba(214,180,106,.15);
  background: #100d08;
}

.viewer-frame img {
  display: block;
  max-width: 100%;
  max-height: calc(75vh - 25px);
  object-fit: contain;
}

.viewer-name {
  margin: 14px 0;
  color: var(--gold-light);
  font-family: 'Playfair Display', serif;
  text-align: center;
  overflow-wrap: anywhere;
}

.save-button {
  width: 190px;
  padding: 12px;
  border: 1px solid var(--gold);
  border-radius: 30px;
  background: linear-gradient(135deg, #f1d99a, #b58b42);
  color: #170f04;
  font-weight: 600;
}

.download-status {
  color: #c9b78f;
  font-size: 12px;
  margin-top: 10px;
  text-align: center;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 27px;
  }
  main {
    padding-left: 28px;
    padding-right: 28px;
  }
}

@media (min-width: 1000px) {
  .gallery {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

</style>
</head>

<body>

<header>
  <button class="menu-button" onclick="toggleMenu()" aria-label="Menu">⋮</button>

  <div class="header-ornament">✧ ───── ✧</div>
  <div class="logo-mark"><span>Z</span></div>
  <h1 class="logo">ZEZE GALERI</h1>
  <div class="tagline">The Art of Memories</div>
  <div class="header-line"></div>

  <div class="menu-panel" id="menuPanel">
    <div id="loginArea">
      <div class="menu-title">OWNER ACCESS</div>
      <input id="email" type="email" placeholder="Email pemilik" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="gold-button" onclick="login()">MASUK</button>
    </div>

    <div class="owner-area" id="ownerArea">
      <div class="menu-title">✧ OWNER PANEL ✧</div>
      <div class="owner-label">Kamu masuk sebagai pemilik galeri</div>

      <label class="upload-label">
        ＋ Pilih foto untuk diunggah
        <input id="photoInput" type="file" accept="image/*" multiple onchange="uploadPhotos(event)">
      </label>

      <button class="dark-button" onclick="logout()">Keluar dari akun</button>
    </div>

    <div class="status" id="status"></div>
  </div>
</header>

<main>
  <div class="gallery-heading">
    <h2>OUR COLLECTION</h2>
    <p>A beautiful place for precious moments</p>
    <div class="heading-line"></div>
  </div>

  <div class="gallery" id="gallery">
    <div class="empty-state">
      <div class="empty-symbol">✧</div>
      Memuat koleksi foto...
    </div>
  </div>
</main>

<footer>
  ✧ ZEZE GALERI · A Collection of Memories ✧
</footer>

<div class="viewer" id="viewer" onclick="closeViewer(event)">
  <button class="viewer-close" onclick="closeViewer()">×</button>

  <div class="viewer-frame" onclick="event.stopPropagation()">
    <img id="viewerImage" src="" alt="Foto galeri">
  </div>

  <div class="viewer-name" id="viewerName"></div>

  <button class="save-button" id="saveButton" onclick="saveCurrentPhoto(event)">
    ↓ SIMPAN FOTO
  </button>

  <div class="download-status" id="downloadStatus"></div>
</div>

<script>
const SUPABASE_URL =
  "https://dhjxyldtygcibrtnpjcd.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_daMV08AfTIex0whIdKdtsQ_wwsfghsp";

const BUCKET = "zeze-foto";

const OWNER_UID = "d0a87020-4e24-4982-843a-f1d56f657267";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentPhoto = null;
let galleryPromise = null;
let galleryRequest = 0;

function setStatus(message) {
  document.getElementById("status").textContent = message || "";
}

function isOwner() {
  return currentUser && currentUser.id === OWNER_UID;
}

function toggleMenu() {
  document.getElementById("menuPanel").classList.toggle("show");
}

document.addEventListener("click", function(event) {
  const panel = document.getElementById("menuPanel");
  const button = document.querySelector(".menu-button");

  if (!panel.contains(event.target) && !button.contains(event.target)) {
    panel.classList.remove("show");
  }
});

function updateLoginUI() {
  const loggedIn = isOwner();

  document.getElementById("loginArea").style.display =
    loggedIn ? "none" : "block";

  document.getElementById("ownerArea").classList.toggle(
    "show",
    !!loggedIn
  );
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    setStatus("Isi email dan password terlebih dahulu.");
    return;
  }

  setStatus("Sedang masuk...");

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    setStatus("Login gagal: " + error.message);
    return;
  }

  if (data.user.id !== OWNER_UID) {
    await db.auth.signOut();
    currentUser = null;
    updateLoginUI();
    setStatus("Akun ini bukan akun pemilik galeri.");
    return;
  }

  currentUser = data.user;
  updateLoginUI();
  setStatus("Berhasil masuk!");

  document.getElementById("password").value = "";
  await loadGallery();
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  updateLoginUI();
  setStatus("Kamu sudah keluar.");
  await loadGallery();
}

function isImageFile(file) {
  return file &&
    file.name &&
    file.metadata &&
    file.metadata.mimetype &&
    file.metadata.mimetype.startsWith("image/");
}

async function uploadPhotos(event) {
  if (!isOwner()) {
    setStatus("Silakan login sebagai pemilik.");
    return;
  }

  const files = Array.from(event.target.files || []);

  if (!files.length) return;

  setStatus("Sedang mengunggah foto...");

  let success = 0;
  let failed = 0;

  for (const file of files) {
    if (!file.type.startsWith("image/")) {
      failed++;
      continue;
    }

    const extension = file.name.split(".").pop() || "jpg";
    const safeName = file.name
      .replace(/\.[^/.]+$/, "")
      .replace(/[^a-zA-Z0-9_-]/g, "-")
      .slice(0, 50);

    const uniqueName =
      Date.now() + "-" +
      Math.random().toString(36).slice(2, 9) +
      "-" + safeName + "." + extension;

    const { error } = await db.storage
      .from(BUCKET)
      .upload(uniqueName, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type
      });

    if (error) {
      console.error(error);
      failed++;
    } else {
      success++;
    }
  }

  event.target.value = "";

  setStatus(
    "Selesai! Berhasil: " + success +
    (failed ? " · Gagal: " + failed : "")
  );

  await loadGallery();
}

async function loadGallery() {
  if (galleryPromise) {
    galleryRequest++;
    return galleryPromise;
  }

  galleryPromise = (async function() {
    const gallery = document.getElementById("gallery");

    try {
      const { data, error } = await db.storage
        .from(BUCKET)
        .list("", {
          limit: 1000,
          sortBy: { column: "created_at", order: "desc" }
        });

      if (error) throw error;

      const seen = new Set();

      const photos = (data || []).filter(file => {
        if (!file.name || file.name.startsWith(".")) return false;

        const type = file.metadata?.mimetype || "";
        const imageExtension = /\.(jpg|jpeg|png|gif|webp|bmp|avif|heic)$/i.test(file.name);

        if (!type.startsWith("image/") && !imageExtension) return false;
        if (seen.has(file.name)) return false;

        seen.add(file.name);
        return true;
      });

      gallery.innerHTML = "";

      if (!photos.length) {
        gallery.innerHTML = `
          <div class="empty-state">
            <div class="empty-symbol">✧</div>
            Belum ada foto di galeri.<br>
            Koleksi kenanganmu akan tampil di sini.
          </div>
        `;
        return;
      }

      photos.forEach((photo, index) => {
        const { data: publicData } = db.storage
          .from(BUCKET)
          .getPublicUrl(photo.name);

        const card = document.createElement("div");
        card.className = "photo-card frame-" + (index % 5);

        const img = document.createElement("img");
        img.src = publicData.publicUrl;
        img.alt = photo.name;
        img.loading = "lazy";
        img.addEventListener("click", () => {
          openViewer(publicData.publicUrl, photo.name);
        });

        const name = document.createElement("div");
        name.className = "photo-name";
        name.textContent = photo.name;

        card.appendChild(img);
        card.appendChild(name);

        if (isOwner()) {
          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-button";
          deleteBtn.textContent = "Hapus foto";
          deleteBtn.addEventListener("click", (event) => {
            event.stopPropagation();
            deletePhoto(photo.name);
          });
          card.appendChild(deleteBtn);
        }

        gallery.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      gallery.innerHTML = `
        <div class="empty-state">
          Gagal memuat galeri. Silakan muat ulang halaman.
        </div>
      `;
    }
  })();

  try {
    await galleryPromise;
  } finally {
    galleryPromise = null;
  }
}

function openViewer(url, name) {
  currentPhoto = name;

  document.getElementById("viewerImage").src = url;
  document.getElementById("viewerName").textContent = name;
  document.getElementById("downloadStatus").textContent = "";

  document.getElementById("viewer").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeViewer(event) {
  if (event && event.target !== document.getElementById("viewer")) {
    return;
  }

  document.getElementById("viewer").classList.remove("show");
  document.body.style.overflow = "";
}

async function saveCurrentPhoto(event) {
  if (event) event.stopPropagation();
  if (!currentPhoto) return;

  const status = document.getElementById("downloadStatus");
  status.textContent = "Menyiapkan foto...";

  try {
    const { data, error } = await db.storage
      .from(BUCKET)
      .download(currentPhoto);

    if (error) throw error;

    const blobUrl = URL.createObjectURL(data);
    const link = document.createElement("a");

    link.href = blobUrl;
    link.download = currentPhoto;
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);

    status.textContent = "Foto berhasil disiapkan untuk disimpan.";
  } catch (error) {
    console.error(error);
    status.textContent = "Gagal menyimpan foto. Coba lagi.";
  }
}

async function deletePhoto(name) {
  if (!isOwner()) return;

  const confirmed = confirm(
    "Yakin ingin menghapus foto ini dari galeri?"
  );

  if (!confirmed) return;

  setStatus("Menghapus foto...");

  const { error } = await db.storage
    .from(BUCKET)
    .remove([name]);

  if (error) {
    setStatus("Gagal menghapus: " + error.message);
    return;
  }

  setStatus("Foto berhasil dihapus.");
  await loadGallery();
}

async function initialize() {
  const { data } = await db.auth.getSession();

  currentUser = data.session?.user || null;

  if (currentUser && currentUser.id !== OWNER_UID) {
    await db.auth.signOut();
    currentUser = null;
  }

  updateLoginUI();
  await loadGallery();

  db.auth.onAuthStateChange((event, session) => {
    currentUser = session?.user || null;

    if (currentUser && currentUser.id !== OWNER_UID) {
      currentUser = null;
      db.auth.signOut();
    }

    updateLoginUI();

    setTimeout(() => {
      loadGallery();
    }, 300);
  });
}

initialize();
</script>

</body>
</html>
