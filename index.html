<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeze Galeri</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100d17;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: linear-gradient(135deg,#21152f,#100d17);
  border-bottom: 1px solid #49345e;
}

h1 {
  margin: 0;
  color: #e6c68a;
  letter-spacing: 5px;
  font-size: 28px;
}

header p {
  color: #c4b5d3;
  font-size: 13px;
  letter-spacing: 2px;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px;
}

h2 {
  color: #e6c68a;
  font-size: 17px;
  margin-bottom: 18px;
}

button {
  cursor: pointer;
}

.add-photo, .gold-button {
  background: linear-gradient(135deg,#e6c68a,#b68a45);
  color: #100d17;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  font-size: 14px;
  margin: 5px 5px 15px 0;
}

.dark-button {
  background: #352440;
  color: white;
  border: 1px solid #765b8a;
  border-radius: 10px;
  padding: 11px 16px;
  margin: 5px 5px 15px 0;
}

.login-box {
  display: none;
  background: #21152f;
  border: 1px solid #49345e;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 18px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 8px;
  border: 1px solid #765b8a;
  background: #100d17;
  color: white;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 13px;
}

.photo-card {
  position: relative;
}

.gallery img {
  width: 100%;
  display: block;
  border-radius: 13px;
  border: 1px solid #49345e;
  cursor: pointer;
}

.delete-button {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  background: #572c3b;
  color: white;
  border: 0;
  border-radius: 8px;
}

#status {
  color: #c4b5d3;
  font-size: 13px;
  margin: 8px 0 16px;
}

footer {
  text-align: center;
  color: #887b94;
  padding: 30px 10px;
  font-size: 12px;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #000e;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 5;
}

#viewer img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 12px;
}

#viewer button {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #352440;
  color: white;
  border: 0;
  border-radius: 50%;
  padding: 12px 16px;
  font-size: 20px;
}
</style>
</head>

<body>

<header>
  <h1>ZEZE GALERI</h1>
  <p>YOUR PRIVATE PHOTO COLLECTION</p>
</header>

<main>
  <h2>✦ Koleksi Foto</h2>

  <button class="dark-button" id="loginToggle">
    LOGIN PEMILIK
  </button>

  <section class="login-box" id="loginBox">
    <h3>Login Pemilik</h3>
    <input id="email" type="email" placeholder="Email pemilik">
    <input id="password" type="password" placeholder="Password">
    <button class="gold-button" id="loginButton">MASUK</button>
    <button class="dark-button" id="cancelLogin">BATAL</button>
  </section>

  <section id="ownerPanel" style="display:none">
    <p style="color:#e6c68a">Kamu masuk sebagai pemilik galeri.</p>
    <input id="photoInput" type="file" accept="image/*" hidden>
    <button class="add-photo" id="uploadButton">＋ TAMBAH FOTO</button>
    <button class="dark-button" id="logoutButton">KELUAR</button>
  </section>

  <p id="status">Memuat koleksi foto...</p>

  <div class="gallery" id="gallery"></div>
</main>

<div id="viewer" onclick="closePhoto()">
  <button onclick="closePhoto()">×</button>
  <img id="largePhoto" alt="Foto diperbesar">
</div>

<footer>
  © 2026 ZEZE GALERI
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://dhjxyldtygcibrtnpjcd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_daMV08AfTIex0whIdKdtsQ_wwsfghsp';

const OWNER_UID = 'd0a87020-4e24-4982-843a-f1d56f657267';
const BUCKET = 'zeze-foto';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const gallery = document.getElementById('gallery');
const statusText = document.getElementById('status');
const loginBox = document.getElementById('loginBox');
const ownerPanel = document.getElementById('ownerPanel');

let isOwner = false;

document.getElementById('loginToggle').onclick = () => {
  loginBox.style.display =
    loginBox.style.display === 'block' ? 'none' : 'block';
};

document.getElementById('cancelLogin').onclick = () => {
  loginBox.style.display = 'none';
};

function updateOwnerView(user) {
  isOwner = !!user && user.id === OWNER_UID;

  ownerPanel.style.display = isOwner ? 'block' : 'none';
  document.getElementById('loginToggle').style.display =
    isOwner ? 'none' : 'inline-block';

  if (!isOwner) {
    loginBox.style.display = 'none';
  }

  loadPhotos();
}

document.getElementById('loginButton').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email || !password) {
    alert('Masukkan email dan password terlebih dahulu.');
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {
    alert('Login gagal: ' + error.message);
    return;
  }

  if (data.user.id !== OWNER_UID) {
    await supabaseClient.auth.signOut();
    alert('Akun ini bukan pemilik galeri.');
    return;
  }

  document.getElementById('password').value = '';
  loginBox.style.display = 'none';
  updateOwnerView(data.user);
  alert('Berhasil masuk ke ZEZE GALERI!');
};

document.getElementById('logoutButton').onclick = async () => {
  await supabaseClient.auth.signOut();
  updateOwnerView(null);
  alert('Kamu sudah keluar.');
};

document.getElementById('uploadButton').onclick = () => {
  document.getElementById('photoInput').click();
};

document.getElementById('photoInput').onchange = async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  if (!isOwner) {
    alert('Silakan login sebagai pemilik.');
    return;
  }

  if (!file.type.startsWith('image/')) {
    alert('Pilih file gambar.');
    return;
  }

  statusText.textContent = 'Mengunggah foto...';

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const filePath = Date.now() + '-' + safeName;

  const { error } = await supabaseClient.storage
    .from(BUCKET)
    .upload(filePath, file, {
      cacheControl: '3600',
      upsert: false
    });

  if (error) {
    alert('Upload gagal: ' + error.message);
  } else {
    alert('Foto berhasil ditambahkan!');
    await loadPhotos();
  }

  event.target.value = '';
};

async function loadPhotos() {
  gallery.innerHTML = '';
  statusText.textContent = 'Memuat koleksi foto...';

  const { data, error } = await supabaseClient.storage
    .from(BUCKET)
    .list('', {
      limit: 100,
      sortBy: { column: 'created_at', order: 'desc' }
    });

  if (error) {
    statusText.textContent = 'Gagal memuat foto: ' + error.message;
    return;
  }

  const photos = (data || []).filter(item =>
    item.name && item.name !== '.emptyFolderPlaceholder'
  );

  if (photos.length === 0) {
    statusText.textContent = 'Belum ada foto di galeri.';
    return;
  }

  statusText.textContent = photos.length + ' foto tersimpan';

  photos.forEach(item => {
    const { data: urlData } = supabaseClient.storage
      .from(BUCKET)
      .getPublicUrl(item.name);

    const card = document.createElement('div');
    card.className = 'photo-card';

    const img = document.createElement('img');
    img.src = urlData.publicUrl;
    img.alt = 'Foto Zeze';
    img.onclick = () => openPhoto(img.src);
    card.appendChild(img);

    if (isOwner) {
      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-button';
      deleteButton.textContent = 'HAPUS FOTO';

      deleteButton.onclick = async () => {
        if (!confirm('Yakin ingin menghapus foto ini?')) return;

        const { error: deleteError } = await supabaseClient.storage
          .from(BUCKET)
          .remove([item.name]);

        if (deleteError) {
          alert('Gagal menghapus: ' + deleteError.message);
        } else {
          alert('Foto berhasil dihapus.');
          loadPhotos();
        }
      };

      card.appendChild(deleteButton);
    }

    gallery.appendChild(card);
  });
}

function openPhoto(src) {
  document.getElementById('largePhoto').src = src;
  document.getElementById('viewer').style.display = 'flex';
}

function closePhoto() {
  document.getElementById('viewer').style.display = 'none';
}

async function checkLogin() {
  const { data } = await supabaseClient.auth.getSession();
  updateOwnerView(data.session ? data.session.user : null);
}

supabaseClient.auth.onAuthStateChange((_event, session) => {
  updateOwnerView(session ? session.user : null);
});

checkLogin();
</script>

</body>
</html>
