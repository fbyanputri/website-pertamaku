
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeze Galeri</title>
<style>
body {
  margin: 0;
  padding: 20px;
  background: #f5f0f7;
  font-family: Arial, sans-serif;
  color: #333;
}
h1 { text-align: center; }
p { text-align: center; }
.galeri {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 800px;
  margin: 25px auto;
}
.galeri img {
  width: 100%;
  border-radius: 12px;
  object-fit: cover;
}
</style>
</head>
<body>

<h1>Zeze Galeri</h1>
<p>Kumpulan foto kesayangan</p>

<div class="galeri">
  <img src="https://dhjxyldtygcibrtnpjcd.supabase.co/storage/v1/object/public/zeze-foto/file_00000000bb2c8211821c1a24a519bcb8.png" alt="Foto galeri">
</div>

</body>
</html>
